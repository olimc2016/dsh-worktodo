# 测试与构建（每次 push / PR 都跑）。
#
# 为什么值得有：这个插件的卖点之一是「可被验证」——构建 + 12 步自检不需要启动 DSH。
# CI 把这句话变成可核对的事实，也让目录源与下载者一眼看到它是绿的。
#
# 为什么用 pnpm 而不是 npm：**pnpm 是本地唯一被验证过的路径**。本地没装 npm，而
# @deepseek-ai/dsh-tools 带着 11 个 peer，npm 默认会自动安装 peer，那是一条没人验过的解析路径。
# pnpm 这边还有 `--frozen-lockfile`（lockfile 已提交）配合 pnpm-workspace.yaml 里的
# `autoInstallPeers: false`，本地与 CI 的解析结果因此可以断言一致。
# 注意：package.json 里的脚本都只用 node（见 tools/verify-all.mjs 的说明），
# 所以贡献者用 npm / yarn 跑 `npm test` 一样能用，只是 CI 固定走 pnpm。
name: test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - '22'
          - '24'
    steps:
      - uses: actions/checkout@v4

      # 顺序有讲究：pnpm 必须先于 setup-node，否则 setup-node 的 pnpm 缓存没有可缓存的对象
      - uses: pnpm/action-setup@v4
        with:
          version: '11'

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dev deps
        # 测试要加载官方 @deepseek-ai/dsh-tools 来校验工具 schema，所以必须装 devDependencies
        #（运行期它由 DSH 从安装目录提供，见 docs/verification.md）；
        # esbuild 用预编译二进制，allowBuilds 里已显式禁止它跑构建脚本
        run: pnpm install --frozen-lockfile

      - name: Build client bundle
        run: pnpm run build

      # 覆盖面：构建 + 11 个 suite = 12 步（verify-all 的汇总口径）。
      # 「175 cases」是旧说法，会随 suite 增减漂移；这里写步骤口径，并由 verify-workflows 守着。
      - name: Test (build + 12 steps green, no DSH instance needed)
        run: pnpm test

      - name: Check the published tarball contains the browser half
        # 最容易犯又最致命的发布错误：files 写漏了 lib/client.js，
        # 装上去只有宿主半侧、面板消失
        run: |
          pnpm pack >/dev/null
          tar -tzf dsh-worktodo-*.tgz | tee /tmp/pack.txt
          for required in package/lib/index.js package/lib/client.js package/cordis.patch.yml package/icon.svg; do
            grep -q "$required" /tmp/pack.txt || { echo "::error::tarball is missing $required"; exit 1; }
          done

  # Windows 观测 job：只跑三个纯文本 / 结构 suite（不 import 平台包、不装依赖），
  # 用来攒跨平台证据（路径分隔符 / 换行 / 大小写）。
  # continue-on-error: true 表示「允许失败」：观测中，转正条件见 docs/process/development-standard.md §3.3
  # （全量 suite 在 Windows 连续绿 N 次后改成正式门禁）。
  windows-observe:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      # 不装依赖：这三个 suite 只读文本与 package.json，跑在裸 node 上即可。
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: verify-docs (observational)
        run: node tools/verify-docs.mjs

      - name: verify-meta (observational)
        run: node tools/verify-meta.mjs

      - name: verify-workflows (observational)
        run: node tools/verify-workflows.mjs
